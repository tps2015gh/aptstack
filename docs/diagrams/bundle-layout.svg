<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Segoe UI, Leelawadee UI, Tahoma, sans-serif">
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#10306b">aptstack — ผังโฟลเดอร์ใน bundle</text>
  <text x="24" y="56" font-size="13" fill="#555">ทุกอย่างอยู่ในโฟลเดอร์เดียว — copy = deploy · green = commit ลง git ได้ · orange = ห้าม commit</text>

  <rect x="24" y="76" width="872" height="460" rx="10" fill="#f7f9fc" stroke="#10306b" stroke-width="2"/>
  <text x="40" y="102" font-size="14" font-weight="700" fill="#10306b">D:\aptstack\</text>

  <!-- commit ได้ -->
  <g font-size="13">
    <rect x="40" y="118" width="260" height="56" rx="8" fill="#e5f6ec" stroke="#0a7a33"/>
    <text x="52" y="140" font-weight="700" fill="#0a7a33">scripts (commit ได้)</text>
    <text x="52" y="160" fill="#234">aptstack.cmd/ps1 · setup · service</text>

    <rect x="40" y="186" width="260" height="56" rx="8" fill="#e5f6ec" stroke="#0a7a33"/>
    <text x="52" y="208" font-weight="700" fill="#0a7a33">templates\ (ต้นฉบับ)</text>
    <text x="52" y="228" fill="#234">php.ini / my.ini / httpd.conf / ssl</text>

    <rect x="40" y="254" width="260" height="56" rx="8" fill="#e5f6ec" stroke="#0a7a33"/>
    <text x="52" y="276" font-weight="700" fill="#0a7a33">examples\ + docs\</text>
    <text x="52" y="296" fill="#234">hello / todo / sysinfo + คู่มือ</text>

    <rect x="40" y="322" width="260" height="56" rx="8" fill="#e5f6ec" stroke="#0a7a33"/>
    <text x="52" y="344" font-weight="700" fill="#0a7a33">www\router.php</text>
    (มีเฉพาะไฟล์นี้ที่ commit)
  </g>

  <!-- ห้าม commit -->
  <g font-size="13">
    <rect x="330" y="118" width="270" height="64" rx="8" fill="#fff3e0" stroke="#b26a00"/>
    <text x="342" y="140" font-weight="700" fill="#b26a00">stack\ (binary · ห้าม commit)</text>
    <text x="342" y="158" fill="#234">php\8.3.36 · apache\httpd</text>
    <text x="342" y="176" fill="#234">mysql\mariadb-11.4</text>

    <rect x="330" y="192" width="270" height="56" rx="8" fill="#fff3e0" stroke="#b26a00"/>
    <text x="342" y="214" font-weight="700" fill="#b26a00">versions\ (โค้ดแอป)</text>
    <text x="342" y="234" fill="#234">1.2.0 · todo-app · ...</text>

    <rect x="330" y="258" width="270" height="64" rx="8" fill="#fff3e0" stroke="#b26a00"/>
    <text x="342" y="280" font-weight="700" fill="#b26a00">data\ (ฐานข้อมูล)</text>
    <text x="342" y="298" fill="#234">mariadb-*\datadir · dumps\*.sql</text>
    <text x="342" y="316" fill="#a33">ข้อมูลจริงห้ามขึ้น repo</text>

    <rect x="330" y="332" width="270" height="56" rx="8" fill="#fff3e0" stroke="#b26a00"/>
    <text x="342" y="354" font-weight="700" fill="#b26a00">config\ (ค่าจริง/ของ generate)</text>
    <text x="342" y="374" fill="#234">stack.json · ini · certs\ · pids\</text>
  </g>

  <!-- junction -->
  <g font-size="13">
    <rect x="630" y="118" width="250" height="120" rx="8" fill="#e8f1ff" stroke="#1b57c4" stroke-width="2"/>
    <text x="642" y="140" font-weight="700" fill="#1b57c4">www\app (junction)</text>
    <text x="642" y="162" fill="#234">ชี้ไป versions\&lt;ตัวที่ใช้&gt;</text>
    <text x="642" y="184" fill="#234">+ router.php + phpmyadmin\</text>
    <text x="642" y="212" fill="#1b57c4" font-weight="700">สลับ app = ย้าย junction</text>
    <text x="642" y="230" fill="#234">ของเก่าอยู่ครบ → use - ได้เสมอ</text>

    <rect x="630" y="258" width="250" height="90" rx="8" fill="#f3e8ff" stroke="#6b21a8"/>
    <text x="642" y="280" font-weight="700" fill="#6b21a8">runtime ที่ start สร้างใหม่</text>
    <text x="642" y="300" fill="#234">php.ini · my.ini · httpd.conf</text>
    <text x="642" y="318" fill="#234">จาก templates\ + path จริง</text>
    <text x="642" y="338" fill="#6b21a8" font-weight="700">→ copy ไปเครื่องอื่นไม่พัง</text>
  </g>

  <!-- คำเตือนพื้นที่ -->
  <rect x="40" y="404" width="840" height="112" rx="8" fill="#fffbea" stroke="#c9a800"/>
  <text x="52" y="428" font-size="14" font-weight="700" fill="#7a6500">ระวัง bundle บวม</text>
  <text x="52" y="452" font-size="13" fill="#333">ดูพื้นที่ทุกโฟลเดอร์ + เตือนอัตโนมัติ:  aptstack size  ·  รายงานพิมพ์ได้:  aptstack report</text>
  <text x="52" y="474" font-size="13" fill="#333">ที่มักใหญ่: stack\ (binary) · versions\ (โค้ด/vendor) · data\ (datadir) · downloads\ (zip ค้าง)</text>
  <text x="52" y="496" font-size="13" fill="#333">ชุด deploy เก่าอยู่ใน dist\ / dist_paste\ → ลบก่อน copy ขึ้น server</text>
  <text x="52" y="518" font-size="12" fill="#777">aptstack · vector diagram</text>
</svg>
