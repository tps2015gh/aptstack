<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Segoe UI, Leelawadee UI, Tahoma, sans-serif">
  <rect width="920" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#10306b">สลับเวอร์ชันแอป = ย้าย junction (ของเก่าไม่หาย)</text>
  <text x="24" y="56" font-size="13" fill="#555">www\app เป็น junction ชี้ไป versions\&lt;ตัวที่ใช้&gt; · สลับ = ย้าย pointer + restart web</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10306b"/>
    </marker>
  </defs>

  <g font-size="13">
    <!-- before -->
    <rect x="40" y="96" width="200" height="150" rx="8" fill="#f7f9fc" stroke="#8a8f98"/>
    <text x="52" y="120" font-weight="700" fill="#10306b">ก่อนสลับ</text>
    <rect x="56" y="136" width="168" height="36" rx="6" fill="#e8f1ff" stroke="#1b57c4"/>
    <text x="66" y="159" fill="#1b57c4" font-weight="700">www\app (junction)</text>
    <line x1="140" y1="172" x2="140" y2="196" stroke="#1b57c4" stroke-width="2" marker-end="url(#a2)"/>
    <rect x="56" y="198" width="168" height="36" rx="6" fill="#e5f6ec" stroke="#0a7a33"/>
    <text x="66" y="221" fill="#0a7a33">versions\todo-1.0</text>

    <!-- command -->
    <rect x="290" y="130" width="230" height="84" rx="8" fill="#fffbea" stroke="#c9a800" stroke-width="2"/>
    <text x="302" y="156" font-weight="700" fill="#7a6500">aptstack use todo-1.1</text>
    <text x="302" y="178" fill="#333">1) stop web</text>
    <text x="302" y="196" fill="#333">2) ย้าย junction</text>
    <text x="302" y="214" fill="#333">3) start web + health probe</text>
    <line x1="240" y1="170" x2="288" y2="170" stroke="#10306b" stroke-width="2" marker-end="url(#a2)"/>
    <line x1="520" y1="170" x2="560" y2="170" stroke="#10306b" stroke-width="2" marker-end="url(#a2)"/>

    <!-- after -->
    <rect x="562" y="96" width="200" height="150" rx="8" fill="#f7f9fc" stroke="#8a8f98"/>
    <text x="574" y="120" font-weight="700" fill="#10306b">หลังสลับ</text>
    <rect x="578" y="136" width="168" height="36" rx="6" fill="#e8f1ff" stroke="#1b57c4"/>
    <text x="588" y="159" fill="#1b57c4" font-weight="700">www\app (junction)</text>
    <line x1="662" y1="172" x2="662" y2="196" stroke="#1b57c4" stroke-width="2" marker-end="url(#a2)"/>
    <rect x="578" y="198" width="168" height="36" rx="6" fill="#e5f6ec" stroke="#0a7a33"/>
    <text x="588" y="221" fill="#0a7a33">versions\todo-1.1</text>

    <rect x="562" y="258" width="200" height="52" rx="8" fill="#f3e8ff" stroke="#6b21a8"/>
    <text x="574" y="280" font-weight="700" fill="#6b21a8">ของเก่า (todo-1.0)</text>
    <text x="574" y="300" fill="#234">ยังอยู่ครบ → rollback ได้เสมอ</text>
  </g>

  <g font-size="13">
    <rect x="40" y="330" width="420" height="130" rx="8" fill="#e5f6ec" stroke="#0a7a33" stroke-width="2"/>
    <text x="52" y="356" font-weight="700" fill="#0a7a33">มีปัญหา? ย้อนกลับคำสั่งเดียว</text>
    <text x="52" y="382" fill="#234" font-family="Consolas,monospace">aptstack use -</text>
    <text x="52" y="406" fill="#234">(config เก็บ appPrev ไว้ให้)</text>
    <text x="52" y="430" fill="#234">database ไม่หาย — ค่าต่อ DB อยู่กลาง</text>
    <text x="52" y="450" fill="#234">ที่ config\stack.json (ไม่ผูกกับโฟลเดอร์แอป)</text>

    <rect x="490" y="330" width="400" height="130" rx="8" fill="#e8f1ff" stroke="#1b57c4"/>
    <text x="502" y="356" font-weight="700" fill="#1b57c4">ดู/จัดการเวอร์ชัน</text>
    <text x="502" y="380" fill="#234">aptstack list            [todo] = app family เดียวกัน</text>
    <text x="502" y="402" fill="#234">aptstack clone app a b   ก้อปปี้เป็น b (ยังไม่สลับให้)</text>
    <text x="502" y="424" fill="#234">aptstack remove app b    ลบถาวร (ถามยืนยัน)</text>
    <text x="502" y="448" fill="#234">aptstack next | prev     วนดู</text>
  </g>
  <text x="40" y="500" font-size="12" fill="#777">aptstack · vector diagram</text>
</svg>
