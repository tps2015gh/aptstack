; ==========================================================================
; aptstack extension list
; ถูก append เข้า runtime\php.ini ทุกครั้งที่ start / use php
;
; กฎ: aptstack จะเพิ่มเฉพาะบรรทัดที่เจอไฟล์ dll จริงใน <php>\ext\
;      ดังนั้นใช้ร่วมกับ PHP ได้ทุก version โดยไม่พัง
;
; หมายเหตุ: ไฟล์ php.ini ของ PHP ที่โหลดจาก zip แบบทางการ (php.ini-production)
;            มี extension ถูก comment ไว้ทั้งหมด -> ไฟล์นี้คือตัวที่เปิดให้จริง
; ==========================================================================

; ---- ที่แอป PHP ต้องใช้ (CodeIgniter / mysqli) ----
extension=mysqli
extension=pdo_mysql
extension=mbstring
extension=curl
extension=fileinfo
extension=gd
extension=openssl
extension=zip
extension=intl
extension=exif

; ---- ที่ควรเป็นถ้ามี ----
extension=sodium
extension=sqlite3
extension=pdo_sqlite
extension=soap
extension=xsl
extension=bcmath
extension=gmp
extension=sockets
extension=shmop
extension=sysvshm
extension=gettext
extension=ftp
extension=bz2

; ---- opcache (แนะนำสำหรับ server) ----
zend_extension=opcache
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; ---- Xdebug: ปิดโดยปริยายบน server (มีก็ไม่โหลด) ----
; ถ้าต้องการดีบัก ให้เอา ; ออก แล้ว aptstack restart
;zend_extension=php_xdebug.dll
;xdebug.mode=develop,debug
;xdebug.start_with_request=trigger
