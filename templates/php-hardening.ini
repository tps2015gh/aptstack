; ==========================================================================
; aptstack hardening - APPENDED onto the PHP build's own php.ini
; ถูก regenerate ทุกครั้งที่ aptstack start / use php
; แก้ถาวรที่ไฟล์นี้ (templates\php-hardening.ini) — ห้ามแก้ runtime\php.ini
;
; หมายเหตุ: ใน php.ini directive ที่ปรากฏหลังสุดจะชนะค่าก่อนหน้า
;            ดังนั้น block นี้จึง override ค่าของ PHP build ได้
; ==========================================================================

; ---- ช่องโหว่ RCE (security-php.txt / CVE ระดับ 9.2) ----
; หนึ่งในทางเข้าของช่องโหว่คือ session upload progress
session.upload_progress.enabled = Off

; ---- ไม่ให้เผยตัวตนเวอร์ชัน ----
expose_php = Off

; ---- URL include/fopen ที่เปิดทางให้โหลด remote code ----
allow_url_include = Off

; ---- error ห้ามโชว์หน้าเว็บ (กันรั่ว path / SQL / credential) ----
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "{{LOGS}}/php-error.log"

; ---- session hardening ----
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 1800

; ---- resource limits ----
max_execution_time = 60
max_input_time = 60
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 64M
default_socket_timeout = 30

; ---- CGI path info (กัน path traversal แบบ cgi.fix_pathinfo=0) ----
cgi.fix_pathinfo = 1

; ---- ปิดฟังก์ชันที่ไม่จำเป็นสำหรับเว็บแอป ----
; ถ้าแอปพังให้ตัดตัวที่จำเป็นออกทีละตัว (ตรวจด้วย aptstack doctor แล้วเปิด error log)
;disable_functions = phpinfo,dl,putenv,symlink,proc_open,passthru,shell_exec,exec,system

; ---- Xdebug ปิดเมื่อรันบน server (ถ้ามี ext นี้) ----
xdebug.mode = off
xdebug.start_with_request = no
